services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ocrdocflow_user
      POSTGRES_PASSWORD: changeme_password
      POSTGRES_DB: ocrdocflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db

volumes:
  pgdata:
