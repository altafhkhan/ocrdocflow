# Step 1 config — HTTP only. Serves the ACME challenge for certbot and
# redirects everything else to HTTPS once ocrdocflow-ssl.conf.example is
# activated (see ../DEPLOY.md). Kept as its own file so nginx can start
# successfully before a certificate exists.
#
# This file gets copied into the Console's nginx conf.d directory on the
# droplet (/opt/console/deploy/nginx/) - the two products share one
# nginx/certbot setup rather than each running their own. See ../DEPLOY.md.

server {
    listen 80;
    server_name ocrdocflow.qumaxa.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
